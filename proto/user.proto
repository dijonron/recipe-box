syntax = "proto3";

package user;

option go_package = "github.com/dijonron/recipe-box/proto/user";

service User {
  // Create a new user.
  rpc CreateUser (CreateUserRequest) returns (CreateUserResponse);
  // Get user details by email.
  rpc GetUserByEmail (GetUserByEmailRequest) returns (GetUserByEmailResponse);
  // Update the last login time of a user.
  rpc UpdateUserLastLogin (UpdateUserLastLoginRequest) returns (UpdateUserLastLoginResponse);
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserByEmailResponse {
  UserDetails user = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message CreateUserResponse {
  string token = 1;
}

message UserDetails {
  string name = 2;
  string email = 3;
  string passwordHash = 4;
  string tenant_id = 5;
  string role = 6;
}

message UpdateUserLastLoginRequest {
  string email = 1;
}

message UpdateUserLastLoginResponse {
  // This is an empty message.
}